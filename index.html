<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migraciones AR - Procedure Status</title>
<meta name="description" content="Check the status of an Argentine immigration procedure">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Migraciones">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>Procedure Status Check</h1>

    <div class="card">
      <form id="form" novalidate>
        <div class="row">
          <label for="nro_expediente">File number</label>
          <input id="nro_expediente" name="nro_expediente" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 1095942025">
        </div>

        <div class="row">
          <label for="birthdate">Date of birth</label>
          <input id="birthdate" name="birthdate" type="date" min="1900-01-01" max="2099-12-31">
        </div>

        <button id="submitBtn" type="submit">Check status</button>
        <div id="message" class="msg"></div>
      </form>
    </div>

    <div id="result" class="card">
      <h2>Result</h2>
      <div id="resultBody"></div>
    </div>
  </div>

<script type="module" src="/main.js" defer></script>
</body>
</html>
